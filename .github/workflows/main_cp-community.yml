# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cp-community

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npm install
          npm run prisma:generate
          npm run prisma:migrate:deploy -- --schema=./prisma/schema.prisma
          npm run build --if-present
          npm run test --if-present

      - name: Prepare standalone bundle
        run: |
          rm -rf dist
          mkdir -p dist/.next
          cp -r .next/standalone/* dist/
          cp -r public dist/public
          cp -r .next/static dist/.next/static
          cp .next/BUILD_ID dist/.next/BUILD_ID
          cp .next/required-server-files.json dist/.next/required-server-files.json
          cp .next/routes-manifest.json dist/.next/routes-manifest.json
          cp .next/prerender-manifest.json dist/.next/prerender-manifest.json
          cp .next/build-manifest.json dist/.next/build-manifest.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: dist

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cp-community'
          slot-name: 'Production'
          package: dist
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3B4CF3338B7A4684A9C8C7FEC11417CF }}